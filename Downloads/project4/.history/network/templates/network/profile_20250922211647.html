{% extends "network/layout.html" %}
{%block body%}
<div id = "profile_display">
    <h1>{{username}}{% if user.username != username %}<span style = "font-size:20px"><form action = "{% url "toggle_follow" username %}" method = "POST">{% csrf_token %}<button class = "postbutton" type ="submit">{% if is_following %}Unfollow{%else%}Follow{%endif%}</button></form></span>{%endif%}</h1>
    <h2><span id ="followers">Followers: {% if followers_count %}{{followers_count}}{%else%}0{%endif%}</span>
        <span id ="following">Following: {%if following_count %}{{following_count}}{%else%}0{%endif%}</span>
    </h2>
</div>
    <div id = "posts-container">
    </div>
    <script>
        const username = "{{username}}";
        document.addEventListener('DOMContentLoaded',function(){
            fetch(`/taking_profile/${username}`) //Fetch ở đây cũng cần tạo path cho url
            .then(response => response.json())
            .then(data =>{
                console.log(data);
                data.posts.forEach(post => add_post(post));
            })
            function add_post(post){
                const postDiv = document.createElement('div');
                let content = post.content;
                postDiv.className = 'newpost-container';
                postDiv.innerHTML=`<h4><a href = "/profile/${post.username}">${post.username}</a></h4>
            <button class = "editpost">Edit post</button>
            <p>${post.timestamp}</p>
            <div id = "content_display" style = "font-size: 22px">
                ${content}
                <div id = "content_edit">
                <textarea id = "textarea_display">${content}</textarea>
                <button id = "save">Save</button>
                </div>
            </div>
            <div>
                <span class = "likes-count">${post.number_of_likes} Likes</span>
                <div></div>
                {% if user.is_authenticated %}
                <a class = "likebutton" href ="/like/${post.id}/profile"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/23/Facebook_Like_button.svg/1024px-Facebook_Like_button.svg.png" data-post-id="{{post_listing.id}}" width="25" height="25" alt="buttonpng" border="0" /></a>
                {%else%}Please log in to like this post
                {% endif %}
            </div>`
            document.getElementById('posts-container').appendChild(postDiv);
            document.querySelectorAll('#content_edit').forEach(savedisplay =>{
                console.log(savedisplay)
                savedisplay.style.display='none';
            })
            }
            document.querySelectorAll(".editpost").forEach(edit => {
                edit.onclick = function(event){
                    event.preventDefault();
                    const postcontainer = edit.parentElement; //chọn parent element
                    console.log(postcontainer);
                    const editcontent = postcontainer.querySelector('#content_edit'); //query div trong parent element
                    console.log(editcontent);
                    editcontent.style.display = 'block';
                }
            })
        })
    </script>
{%endblock%}
